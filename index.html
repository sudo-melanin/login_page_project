<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <title>Enter Details for Access</title>
</head>
<body>
  <main id="main-group">
    <h2>Login</h2>
    <form>
      <div class="input-group">
        <label for="username">Username:</label>
        <div class="input-wrapper">  
          <i class="fa-solid fa-user"></i>
          <input id="username" type="text" placeholder="Enter your username" required>
        </div> 
      </div>
      <hr>
      <div class="input-group">
        <label for="password">
          Password
        </label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input id="password" type="password" placeholder="Enter your password" required>
        </div>
      </div> 
      <hr>
      <a href="#" class="forgot-password">forgot password?</a>
      <div class="btn">
        <button type="submit">Sign In</button>
      </div>
    </form>
    <div class="sign-up-option">
      <p>Or Sign In Using</p>
      <div class="social-login">
        <a href="#" class="facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="x-twitter"><i class="fab fa-x-twitter"></i></a>
        <a href="#" class="gmail-icon-fa">
          <i class="fab fa-google"></i>
        </a>
      </div>
      <div class="custom-signup">
        <p>  New User?  <br><span class="new-user">sign up <a href="#">HERE</a></span></p>
        
    </div>
    </div>
  </main>
</body>
</html>
